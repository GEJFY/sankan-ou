services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sankanou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sankanou_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sankanou}
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sankanou"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8003:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sankanou:sankanou_dev@db:5432/sankanou
      PYTHONPATH: /app
      # GCP Vertex AI ADC認証 (Gemini フォールバック利用時のみ必要)
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
    volumes:
      - ./apps/api:/app
      # GCP ADC 認証ディレクトリをマウント (Vertex AI 経由の Gemini フォールバック利用時のみ必要)。
      # ${APPDATA} は Windows 専用の環境変数で、macOS/Linux では空文字になり
      # `docker compose up` のバインドマウントが失敗する原因になっていたため、
      # クロスプラットフォームな GOOGLE_APPLICATION_CREDENTIALS_DIR に変更。
      # 既定値は ./docker/gcloud-creds (空ディレクトリをリポジトリに同梱) なので、
      # 未設定・Gemini 未使用でも docker compose up は失敗しない。
      # 実際に Vertex AI 経由の Gemini フォールバックを使う場合は、
      # `gcloud auth application-default login` 実行後に生成される
      # application_default_credentials.json を含むディレクトリを指定する:
      #   Windows:      set GOOGLE_APPLICATION_CREDENTIALS_DIR=%APPDATA%\gcloud
      #   macOS/Linux:  export GOOGLE_APPLICATION_CREDENTIALS_DIR=$HOME/.config/gcloud
      - ${GOOGLE_APPLICATION_CREDENTIALS_DIR:-./docker/gcloud-creds}:/gcp:ro
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "alembic upgrade head && python -m seed.seed_db && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8003
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  pgdata:
